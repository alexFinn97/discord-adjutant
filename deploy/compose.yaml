# Runs the bot on a Linux VM. Lives in ~/discord-adjutant on the VM, next to the .env file.
# The deploy workflow copies this file there and runs: docker compose pull && docker compose up -d
services:
  bot:
    image: ghcr.io/alexfinn97/discord-adjutant:latest
    env_file: .env
    restart: unless-stopped
    # Caps so the bot can't crowd out other services on a shared machine.
    # It peaks at about 320 MB today. The current host has about 4 GB, so 2 GB leaves
    # room for the OS; lower this on a smaller host such as a 1 GB Pi.
    mem_limit: 2g
    cpus: "1.0"
    volumes:
      - bot-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
